name: Atualizar avaliações do Google

on:
  schedule:
    - cron: '0 12 * * 1' # toda segunda-feira, 09:00 (Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar avaliações mais recentes
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/update-reviews.mjs

      - name: Commit e push (só se houver mudança)
        run: |
          if [ -n "$(git status --porcelain src/data/reviews.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/reviews.json
            git commit -m "chore: atualiza avaliações do Google"
            git push
          else
            echo "Nenhuma avaliação nova."
          fi
